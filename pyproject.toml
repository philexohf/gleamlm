[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "gleamlm"
dynamic = ["version"]
description = "GleamLM — A lightweight language model for education and research"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "Fei Zhang", email = "philex_hf@163.com"},
]
keywords = ["llm", "language-model", "transformer", "chinese", "educational", "pretraining"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.20",
    "tqdm>=4.64",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
    "tensorboard>=2.21",
]
dev = [
    "pytest",
    "pytest-cov",
    "tensorboard>=2.21",
    "ruff>=0.15",
    "mypy>=2.0",
    "pre-commit>=4.0",
    "pydantic>=2.0",
]
data = [
    "pandas",
    "pyarrow>=10.0",
    "fastparquet",
]
tools = [
    "zhconv",
    "safetensors>=0.4",
]
quality = [
    "openai>=1.0",
    "fasttext-wheel>=0.9",
]
hf = [
    # HF 生态集成 (hf/ serve/ deploy/ eval/): transformers.cache_utils 4.30 才有，
    # 版本必须钉住，否则 hf_model.py import 即崩
    "transformers>=4.30",
]
industrial = [
    # 工业轨 (industrial/ tools/convert_megatron_to_hf.py): Megatron 预训练 + TRL 后训练。
    # 全为可选 —— 手工核心轨 (manual/ + gleamlm/) 零 HF/Megatron 依赖，可不装。
    "megatron-core>=0.16,<0.17",   # 代码按 0.16 API (GPTModel 显式 vocab/max_seq、optimizer_param_scheduler)
    "transformers>=4.44",          # TRL/GRPO 需较新 transformers (chat template / Trainer 集成)
    "trl>=1.0",                    # GRPOConfig/GRPOTrainer/RLOOTrainer (1.x)
    "peft>=0.13",
    "accelerate>=0.30",
    "datasets>=3.0",
    "tokenizers>=0.19",
    # DeepSpeed 可选 (manual/deepspeed.py, industrial 多卡): torch2.6 下 0.19.x import 崩
    # (infer_schema 拒绝 list[int])，本仓库锁定 0.16.x
    "deepspeed>=0.16,<0.17",
]
eval = [
    # 标准评测 (eval/ tools/eval_runner.py): lm-evaluation-harness 官方框架，
    # CEVAL/CMMLU/MMLU 均为框架注册任务，不自写评测器
    "lm-eval>=0.4",
    "transformers>=4.30",
]

[project.urls]
Homepage = "https://github.com/philexohf/gleamlm"
Repository = "https://github.com/philexohf/gleamlm"

[tool.setuptools.packages.find]
include = ["gleamlm", "gleamlm.*"]

[tool.setuptools.package-data]
gleamlm = ["tokenizer/checkpoints/bbpe_12k/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = []

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "N812",  # lowercase-to-non-lower (PyTorch `F` convention)
    "N806",  # non-lowercase var (Q/K/V in attention, ML convention)
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # re-exports
"tools/eval_layer_dropout.py" = ["SIM115"]  # stdout redirect
"tests/test_tokenizer.py" = ["SIM115"]  # NamedTemporaryFile manual cleanup
"data_tools/pretrain/extract_text.py" = ["F401", "B018"]  # availability probe
"data_tools/sft/generate.py" = ["E402"]  # sys.path before data_tools imports
"data_tools/sft/generate_longform.py" = ["E402"]  # sys.path before data_tools imports
"data_tools/sft/generate_multiturn.py" = ["E402"]  # sys.path before data_tools imports
"data_tools/pretrain/score.py" = ["E402"]  # sys.path before data_tools imports
"gleamlm/utils/config.py" = ["N806"]  # NO_PREFIX convention

[tool.ruff.lint.isort]
known-first-party = ["gleamlm"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_generics = false
exclude = [
    "tools/",
    "data_tools/",
    "tests/",
    "configs/",
    "manual/",
    "industrial/",
    "hf/",
    "eval/",
    "serve/",
    "deploy/",
]

[[tool.mypy.overrides]]
module = "numpy"
ignore_errors = true

[[tool.mypy.overrides]]
module = "tqdm"
ignore_missing_imports = true

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

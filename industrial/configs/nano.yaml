# GleamLM-Nano 工业轨 Megatron 配置
# 对应 configs/nano.yaml (12L×512d, BBPE 12K)

model:
  hidden_size: 512
  num_layers: 12
  num_attention_heads: 8
  num_query_groups: 4
  ffn_hidden_size: 1365
  seq_length: 1024
  max_position_embeddings: 1024
  vocab_size: 12002

parallel:
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  context_parallel_size: 1

training:
  micro_batch_size: 4
  global_batch_size: 64
  accumulate_grad: 16          # 有效 batch = micro(4) × 16 = 64，对齐手写轨 8×8
  train_iters: 100
  lr: 0.0004
  min_lr: 4.0e-5
  min_lr_ratio: 0.1
  lr_decay_style: wsd          # 对齐 configs/nano.yaml lr.type: wsd
  lr_warmup_ratio: 0.02        # 对齐 nano warmup_ratio
  stable_ratio: 0.80           # 对齐 nano stable_ratio
  lr_wsd_decay_style: linear   # 对齐手写轨 nano 实际衰减 (wsd_linear_v2 / SmolLM3)
  weight_decay: 0.1
  clip_grad: 1.0
  z_loss_weight: 0.0001         # 对齐 configs/nano.yaml advanced.z_loss_weight
  bf16: true
  fp16: false
  log_interval: 5
  eval_interval: 50
  save_interval: 25

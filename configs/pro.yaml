# ============================================================================
# GleamLM-Pro 126M 配置（18L×768d, GQA 12/6, SwiGLU, RoPE）
# ============================================================================
extends: base.yaml

training:
  epochs: 3
  batch_size: 2
  accumulate_grad: 32
  max_train_chars: 8000000000

lr:
  type: wsd
  lr: 0.0003
  warmup_ratio: 0.03
  stable_ratio: 0.80
  min_lr_ratio: 0.05

model:
  vocab_size: 12002
  d_model: 768
  num_layers: 18
  num_heads: 12
  num_kv_heads: 6
  d_ff: 2048
  max_seq_len: 4096
  dropout: 0.0
  tie_weights: true
  use_flash_attn: true
  use_gradient_checkpointing: true

data:
  data_dir: data/pro/pretrain
  tokenizer_path: gleamlm/tokenizer/checkpoints/bbpe_12k
  checkpoint_dir: checkpoints/pro
  ids_prefix: ""

advanced:
  z_loss_weight: 0.0001
  bf16: true

sft:
  max_seq_len: 4096
  data_path: data/pro/sft_data.jsonl

dpo:
  max_seq_len: 4096
  data_path: data/pro/dpo_data.jsonl

data_sources:
  # 预训练不用问答语料（调研共识 + qa 实测保留率 22.8%，见设计文档 §21）；
  # 2026-09 移除 qa:0.10，剩余四源按原相对比例等比放大
  - {name: edu, type: text, ratio: 0.39}
  - {name: news, type: news, ratio: 0.22}
  - {name: wiki, type: text, ratio: 0.22}
  - {name: baike, type: text, ratio: 0.17}

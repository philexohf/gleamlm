# ============================================================================
# GleamLM-Lite 87M 配置
# ============================================================================
# 继承 base.yaml 兜底；显式键为 Lite 训练生效值（与 base 同值属刻意锁定，
# 训练以本文件为准，不随 base 变动漂移）
extends: base.yaml

training:
  epochs: 1
  batch_size: 4
  accumulate_grad: 16
  max_train_chars: 6130000000   # 6.13B chars (与 nano 统一)
  label_smoothing: 0.1          # 标签平滑

lr:
  type: cosine                   # Cosine Annealing + Warmup
  lr: 0.0004
  warmup_ratio: 0.02
  min_lr_ratio: 0.1

model:
  vocab_size: 12002
  d_model: 768
  num_layers: 12
  num_heads: 12
  num_kv_heads: 6
  d_ff: 2048
  max_seq_len: 2048
  dropout: 0.0
  tie_weights: true
  use_flash_attn: true

data:
  data_dir: data/lite/pretrain
  tokenizer_path: gleamlm/tokenizer/checkpoints/bbpe_12k
  checkpoint_dir: checkpoints/lite
  ids_prefix: ""

advanced:
  z_loss_weight: 0.0001
  bf16: true

sft:
  # 显式锁定（当前同 base 默认）；Lite 重训时按实测调整
  epochs: 3
  batch_size: 8
  accumulate_grad: 4
  lr: 1.0e-4
  warmup_ratio: 0.02
  weight_decay: 0.01
  max_seq_len: 2048
  inject_system_ratio: 0.2
  data_path: data/lite/sft/sft_api_clean.jsonl

dpo:
  # 显式锁定（当前同 base 默认）；Lite 重训时按实测调整
  epochs: 1
  batch_size: 2
  accumulate_grad: 2
  lr: 1.0e-6
  beta: 0.3
  max_seq_len: 2048
  warmup_ratio: 0.02
  min_lr_ratio: 0.05
  data_path: data/lite/dpo/dpo_data.jsonl

data_sources:
  - {name: edu, type: text, ratio: 0.55}
  - {name: news, type: news, ratio: 0.27}
  - {name: wiki, type: text, ratio: 0.12}
  - {name: baike, type: text, ratio: 0.06}

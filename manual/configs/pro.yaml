# ============================================================================
# GleamLM-Pro 126M 配置（18L×768d, GQA 12/6, SwiGLU, RoPE）
#             — 独立完整配置（不依赖 extends）
# ============================================================================
# 本文件所有生效键显式列出：值 = base.yaml 公共默认与 Pro 实证合并后的快照，
# 可直接独立使用；与 base 同值属刻意锁定，不随 base 漂移。base.yaml 仅作
# 公共默认参考 / 新配置复制模板（复制 base → 改名 → 改值即可新建配置）。
# 段序与 base.yaml 对齐，便于对照。

# ---- 预训练控制 ----
training:
  seed: 42
  # 多遍训练（epochs=3），数据预算 8B chars
  epochs: 3
  batch_size: 2
  accumulate_grad: 32
  clip_grad: 1.0
  weight_decay: 0.01
  label_smoothing: 0.1          # 标签平滑
  log_interval: 50
  eval_interval: 500
  save_interval: 2000
  max_train_chars: 8000000000

# ---- 学习率（WSD）----
lr:
  type: wsd
  wsd_decay_style: linear       # decay 段线性（nano_wsd_linear_v2/SmolLM3 实证）
  lr: 0.0003
  warmup_ratio: 0.03
  stable_ratio: 0.80
  min_lr_ratio: 0.05

# ---- 优化器 ----
optimizer:
  type: adamw
  betas: [0.9, 0.95]
  eps: 1.0e-8

# ---- 模型架构 ----
model:
  vocab_size: 12002
  d_model: 768
  num_layers: 18
  num_heads: 12
  num_kv_heads: 6
  d_ff: 2048
  max_seq_len: 4096
  dropout: 0.0
  tie_weights: true
  use_flash_attn: true
  use_gradient_checkpointing: true

# ---- 数据路径 ----
data:
  data_dir: data/pro/pretrain
  tokenizer_path: gleamlm/tokenizer/checkpoints/bbpe_12k
  checkpoint_dir: checkpoints/pro
  ids_prefix: ""
  load_checkpoint: null          # 续训起点模型权重（可选）

# ---- 预训练数据源 ----
data_sources:
  # 预训练不用问答语料（调研共识 + qa 实测保留率 22.8%，见设计文档 §21）；
  # 2026-09 移除 qa:0.10，剩余四源按原相对比例等比放大
  - {name: edu, type: text, ratio: 0.39}
  - {name: news, type: news, ratio: 0.22}
  - {name: wiki, type: text, ratio: 0.22}
  - {name: baike, type: text, ratio: 0.17}

# ---- 高级 ----
advanced:
  z_loss_weight: 0.0001
  bf16: true
  pin_memory: true
  num_workers: 0               # Windows + memmap: 0 is fastest; Linux: try 2-4

# ---- SFT 微调 ----
sft:
  # 显式锁定（当前同 base 默认）；Pro 训练时按实测调整
  epochs: 3
  batch_size: 8
  accumulate_grad: 4
  lr: 1.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.02
  stable_ratio: 0.80           # WSD 专用 (cosine 时忽略)
  min_lr_ratio: 0.05           # cosine 终点比例
  weight_decay: 0.01
  max_seq_len: 4096
  inject_system_ratio: 0.2
  data_path: data/pro/sft_data.jsonl

# ---- DPO 偏好对齐 ----
dpo:
  # 显式锁定（当前同 base 默认）；Pro 训练时按实测调整
  epochs: 1
  batch_size: 2
  accumulate_grad: 2
  lr: 1.0e-6
  beta: 0.3
  max_seq_len: 4096
  warmup_ratio: 0.02
  min_lr_ratio: 0.05
  data_path: data/pro/dpo_data.jsonl

# ---- 分布式 ----
distributed:
  backend: auto   # auto: Windows 自动回退 gloo，Linux 使用 nccl

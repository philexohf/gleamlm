# ============================================================================
# GleamLM 公共默认配置 — 新配置模板 / 公共默认参考
# ============================================================================
# 本文件本身是完整可运行的配置，同时充当模板：新建模型配置请复制本文件为
# <my>.yaml 再改值（复制即得全量必读键，不会因缺键在校验时报错）。
# 内置变体 (nano/lite/pro) 已独立完整展开，不再 extends 本文件，
# 改动公共默认需同步到各变体或只改目标变体。
# 键的实证来源与历史记录见各变体 yaml。

# ---- 预训练控制 ----
training:
  seed: 42
  # 单遍数据预算由 max_train_chars 封顶（默认单遍）
  epochs: 1
  # 有效 batch = micro 8 × accumulate 8 = 64
  batch_size: 8
  accumulate_grad: 8
  clip_grad: 1.0
  weight_decay: 0.01
  label_smoothing: 0.1            # 标签平滑
  log_interval: 50
  eval_interval: 500
  save_interval: 2000
  # 单遍数据预算 6.13B chars
  max_train_chars: 6130000000

# ---- 学习率（默认 WSD）----
lr:
  type: wsd
  wsd_decay_style: linear          # WSD decay 段衰减方式 (线性对齐 nano/SmolLM3 实证)
  # WSD 起始 lr 4e-4，decay 期线性降至 4e-5（lr × min_lr_ratio）
  lr: 0.0004
  warmup_ratio: 0.02             # warmup 占 2%
  stable_ratio: 0.80             # stable 占 80%（其余 20% 线性 decay）
  min_lr_ratio: 0.1

# ---- 优化器 ----
optimizer:
  type: adamw
  betas: [0.9, 0.95]
  eps: 1.0e-8

# ---- 模型架构占位 (各模型覆盖) ----
model:
  vocab_size: 12002
  d_model: 512
  num_layers: 12
  num_heads: 8
  num_kv_heads: 4
  d_ff: 1365
  max_seq_len: 1024
  dropout: 0.1
  tie_weights: true
  use_flash_attn: false

# ---- 数据路径 ----
data:
  data_dir: ""
  tokenizer_path: ""
  checkpoint_dir: ""
  ids_prefix: ""
  load_checkpoint: null

# ---- 预训练数据源 ----
data_sources: []                # 各变体覆盖：{name, type, ratio, file}

# ---- 高级 ----
advanced:
  # z-loss 防 logits 爆炸（默认 1e-4；置 0 关闭）
  z_loss_weight: 0.0001
  bf16: true
  pin_memory: true
  num_workers: 0                # Windows + memmap: 0 is fastest; Linux: try 2-4

# ---- SFT 微调 ----
sft:
  epochs: 3
  batch_size: 8
  accumulate_grad: 4
  # SFT 默认超参（实测基线见各变体 yaml）
  lr: 1.0e-4
  lr_scheduler: cosine          # SFT 基线余弦调度 (终点 = lr × min_lr_ratio)
  warmup_ratio: 0.02
  stable_ratio: 0.80           # WSD 专用 (cosine 时忽略)
  min_lr_ratio: 0.05           # cosine 终点比例
  weight_decay: 0.01
  max_seq_len: 1024
  inject_system_ratio: 0.2
  data_path: ""

# ---- DPO 偏好对齐 ----
dpo:
  epochs: 1
  batch_size: 2
  accumulate_grad: 2
  # DPO 默认超参（实测基线见各变体 yaml）
  lr: 1.0e-6
  beta: 0.3
  max_seq_len: 1024
  warmup_ratio: 0.02
  min_lr_ratio: 0.05
  data_path: ""

# ---- OPD 在线策略蒸馏 ----
opd:
  # 默认 = nano 实证/演示标准 (README §OPD: 40 prompt × 4 epochs = 80 步,
  # T=1.0, n_samples=2 组内 LOO, entropy_coeff 0.01)
  epochs: 4
  batch_size: 2
  n_samples: 2
  # OPD 用小 lr: 更新方向来自采样轨迹, 大 lr 易崩
  lr: 5.0e-6
  weight_decay: 0.01
  clip_grad: 1.0
  max_seq_len: 1024
  max_new_tokens: 128
  temperature: 1.0
  entropy_coeff: 0.01
  aux_coeff: 0.01
  log_interval: 5
  save_interval: 10
  seed: 42
  data_path: ""

# ---- LoRA 微调 (可选路线, 基座用预训练模型) ----
lora:
  # 默认 = 教学演示值 (LoRA r 8 / alpha 16); LoRA 属可选实验路线, 非主链步骤
  epochs: 3
  batch_size: 4
  lr: 2.0e-4
  clip_grad: 1.0
  max_seq_len: 1024
  lora_r: 8
  lora_alpha: 16
  log_interval: 10
  data_path: ""

# ---- 分布式 ----
distributed:
  backend: auto   # auto: Windows 自动回退 gloo，Linux 使用 nccl
